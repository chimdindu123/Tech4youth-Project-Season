<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#20232B">
    <title>Create Account | KARTZUKI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- Brand loading screen -->
    <div class="kz-loader" id="brandLoader">
        <div class="kz-loader-content">
            <div class="kz-loader-logo">
                <!-- Keep your KARTZUKI logo SVG here -->
            </div>
        </div>
    </div>

    <main class="auth-wrapper">

        <!-- Back to homepage -->
        <a href="index.html" class="auth-back">
            <span class="back-arrow">←</span>
            <span>Back to Home</span>
        </a>

        <section class="auth-card">

            <!-- Brand logo -->
            <div class="auth-brand">
                <!-- Keep your KARTZUKI logo SVG here -->
                <h1>KARTZUKI</h1>
            </div>

            <p class="auth-eyebrow">JOIN THE EXPERIENCE</p>

            <h2>Create Account</h2>

            <p class="auth-description">
                Create an account and start your KARTZUKI experience.
            </p>

            <form class="auth-form" id="signupForm">

                <div class="form-group">
                    <label for="signupName">Full Name</label>

                    <input
                        type="text"
                        id="signupName"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>

                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signupPassword"
                        >
                            Show
                        </button>
                    </div>

                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                        <p id="strengthText">Password strength</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <!-- Terms and conditions -->
                <div class="auth-options terms-options">

                    <label class="auth-check-row">
                        <input type="checkbox" id="terms" required>
                        <span>I agree to the terms and conditions</span>
                    </label>

                </div>

                <button type="submit" class="btn btn-primary">
                    Create Account →
                </button>

                <p
                    id="signupFeedback"
                    class="form-feedback"
                    aria-live="polite"
                ></p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="signin.html">Sign In</a>
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#20232B">
    <title>Sign In | KARTZUKI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- Brand loading screen -->
    <div class="kz-loader" id="brandLoader">
        <div class="kz-loader-content">
            <div class="kz-loader-logo">
                <!-- Keep your KARTZUKI logo SVG here -->
            </div>
        </div>
    </div>

    <main class="auth-wrapper">

        <!-- Back to homepage -->
        <a href="index.html" class="auth-back">
            <span class="back-arrow">←</span>
            <span>Back to Home</span>
        </a>

        <section class="auth-card">

            <!-- Brand logo -->
            <div class="auth-brand">
                <!-- Keep your KARTZUKI logo SVG here -->
                <h1>KARTZUKI</h1>
            </div>

            <h2>Welcome Back</h2>

            <p class="auth-description">
                Sign in to continue your shopping experience.
            </p>

            <form class="auth-form" id="signinForm">

                <div class="form-group">
                    <label for="signinEmail">Email Address</label>

                    <input
                        type="email"
                        id="signinEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signinPassword">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="signinPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signinPassword"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <!-- Remember me and forgot password -->
                <div class="auth-options">

                    <label class="auth-check-row">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="btn btn-primary">
                    Sign In →
                </button>

                <p
                    id="signinFeedback"
                    class="form-feedback"
                    aria-live="polite"
                ></p>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
